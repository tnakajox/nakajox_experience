<style>
  :root {
    --bg: #050505;
    --surface: #0c0c0b;
    --paper: #e3dfd3;
    --paper-shade: #cfc9ba;
    --ink: #111110;
    --fg: #e2dfd7;
    --muted: #9a978f;
    --dim: #262523;
    --wabi-rust: #963e33;
    --line: rgba(226, 223, 215, 0.14);
    --line-strong: rgba(226, 223, 215, 0.36);
    --glitch-r: rgba(255, 36, 36, 0.85);
    --glitch-c: rgba(36, 240, 255, 0.85);
    --display: 'Anton', sans-serif;
    --mincho: 'Shippori Mincho', serif;
    --mono: 'JetBrains Mono', monospace;
    --typewriter: var(--mono);
    --sans: var(--mincho);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mincho);
    scroll-behavior: smooth;
    font-kerning: normal;
    text-rendering: optimizeLegibility;
  }

  body {
    background: var(--bg);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "palt" 1;
  }

  body.brush-active, body.brush-active a, body.brush-active button, body.brush-active input {
    cursor: none;
  }

  .asanoha-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg width='96' height='96' viewBox='0 0 96 96' xmlns='http://www.w3.org/2000/svg'%3E%3Cg stroke='%23e2dfd7' stroke-width='0.6' fill='none'%3E%3Cpolygon points='48,0 96,48 48,96 0,48'/%3E%3Cline x1='48' y1='0' x2='48' y2='96'/%3E%3Cline x1='0' y1='48' x2='96' y2='48'/%3E%3Ccircle cx='48' cy='48' r='18'/%3E%3C/g%3E%3C/svg%3E");
    background-size: 96px 96px;
  }

  .grit-overlay {
    position: fixed;
    inset: -8%;
    width: 116%;
    height: 116%;
    z-index: 4;
    pointer-events: none;
    opacity: 0.14;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, transparent 42%, rgba(0, 0, 0, 0.94) 100%);
  }

  #mosaic-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
  }

  #glitch-canvas {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 90;
    pointer-events: none;
    mix-blend-mode: lighten;
  }

  #brush-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999;
    pointer-events: none;
    mix-blend-mode: difference;
  }

  body.glitch-spike .hero-title,
  body.glitch-spike .chomsky-lead,
  body.glitch-spike .featured-title,
  body.glitch-spike .zine-header h2,
  body.glitch-spike .colophon-name {
    text-shadow: 4px 0 var(--glitch-r), -4px 0 var(--glitch-c);
  }

  .vertical-rail {
    position: fixed;
    right: 22px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 80;
    writing-mode: vertical-rl;
    font-family: var(--mincho);
    font-size: 11px;
    letter-spacing: 0.24em;
    color: rgba(226, 223, 215, 0.35);
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .vertical-rail::before {
    content: "";
    width: 1px;
    height: 44px;
    background: var(--wabi-rust);
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 5vw;
    border-bottom: 1px solid var(--line);
    background: rgba(5, 5, 5, 0.94);
    font-family: var(--mincho);
    font-size: 11px;
    letter-spacing: 0.1em;
  }

  .brand-lockup {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--fg);
    text-decoration: none;
    font-weight: 500;
    letter-spacing: 0.06em;
  }

  .hanko-mini {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border: 1px solid var(--wabi-rust);
    color: var(--wabi-rust);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .nav-group {
    display: flex;
    gap: 20px;
  }
  .nav-group a {
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.08em;
    transition: color 0.25s;
  }
  .nav-group a:hover, .nav-group a:focus-visible {
    color: var(--fg);
    outline: none;
  }

  .hero-void {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    width: 100%;
    padding: 104px 7vw 44px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }

  .hero-meta-top {
    font-family: var(--mincho);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .hero-center-block {
    margin: auto 0;
    max-width: 780px;
    padding-left: 1vw;
  }

  .hero-jp-line {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }

  .hanko-seal {
    display: inline-block;
    border: 1px solid var(--wabi-rust);
    color: var(--wabi-rust);
    font-family: var(--mincho);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 2px 7px;
  }

  .hero-title {
    font-family: var(--mincho);
    font-size: clamp(28px, 3.8vw, 46px);
    font-weight: 500;
    line-height: 1.24;
    letter-spacing: 0.04em;
    color: var(--fg);
    margin-bottom: 34px;
  }

  .hero-subtitle-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 12px;
  }

  .en-title-sub {
    display: block;
    font-family: var(--mincho);
    font-size: clamp(14px, 1.5vw, 18px);
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--paper);
  }

  .jp-title-sub {
    display: block;
    font-size: clamp(13px, 1.25vw, 15px);
    letter-spacing: 0.16em;
    color: var(--muted);
  }

  .wabi-rule {
    width: 48px;
    height: 1px;
    background: var(--wabi-rust);
    margin-bottom: 24px;
  }

  .lead-box {
    max-width: 700px;
  }

  .lead-tag {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .chomsky-lead {
    font-family: var(--typewriter);
    font-size: clamp(17px, 2.2vw, 25px);
    font-weight: 400;
    line-height: 1.38;
    letter-spacing: -0.01em;
    color: var(--fg);
    min-height: 1.4em;
  }

  .cursor-block {
    display: inline-block;
    width: 0.42em;
    height: 0.85em;
    background: var(--wabi-rust);
    vertical-align: -0.08em;
    margin-left: 5px;
    animation: blinkBlock 0.85s steps(1) infinite;
  }
  @keyframes blinkBlock {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .bilingual-statement {
    margin-top: 16px;
    opacity: 0;
    transition: opacity 1.1s ease;
    display: grid;
    gap: 7px;
  }
  .bilingual-statement.show {
    opacity: 1;
  }

  .chomsky-jp {
    font-family: var(--mincho);
    font-size: clamp(13px, 1.25vw, 15px);
    color: #c6c3bb;
    letter-spacing: 0.08em;
    line-height: 1.85;
  }

  .chomsky-en {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.02em;
    line-height: 1.7;
  }

  .hero-meta-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-family: var(--mincho);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted);
  }

  .mosaic-zone {
    position: relative;
    z-index: 10;
    min-height: 260vh;
    padding: 0 7vw;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    pointer-events: none;
  }

  .raw-caption {
    position: sticky;
    top: 22vh;
    max-width: 390px;
    background: rgba(5, 5, 5, 0.94);
    border: 1px solid var(--line);
    border-left: 2px solid var(--wabi-rust);
    padding: 28px 30px;
    pointer-events: auto;
  }

  .raw-caption .cap-id {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .raw-caption h2 {
    font-family: var(--mincho);
    font-size: 23px;
    font-weight: 500;
    letter-spacing: 0.06em;
    line-height: 1.5;
    margin-bottom: 14px;
    color: var(--fg);
  }

  .raw-caption p {
    font-family: var(--mincho);
    font-size: 13px;
    line-height: 1.98;
    letter-spacing: 0.03em;
    color: #c2bfb7;
  }

  .raw-caption p.en-note {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-family: var(--sans);
    font-size: 11.5px;
    line-height: 1.65;
    letter-spacing: 0.015em;
    color: var(--muted);
  }

  .featured-section {
    position: relative;
    z-index: 10;
    padding: 104px 6vw;
    background: rgba(8, 8, 7, 0.96);
    border-top: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line-strong);
  }

  .featured-wrap {
    max-width: 1240px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 52px;
    align-items: center;
  }

  .matrix-stage-box {
    position: relative;
    background: #060605;
    border: 1px solid var(--line-strong);
    padding: 14px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
  }

  .matrix-top-bar {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 12px;
  }

  #hero-work-canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #040404;
  }

  .matrix-foot-bar {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding-top: 10px;
    margin-top: 12px;
    border-top: 1px solid var(--line);
  }

  .featured-info {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .featured-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--fg);
  }

  .featured-badge span.seal {
    border: 1px solid var(--wabi-rust);
    color: var(--wabi-rust);
    font-family: var(--mincho);
    padding: 2px 7px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }

  .featured-title {
    font-family: var(--display);
    font-size: clamp(42px, 5.5vw, 72px);
    line-height: 0.94;
    letter-spacing: -0.01em;
    color: var(--fg);
  }

  .featured-question {
    font-family: var(--mincho);
    font-size: 15.5px;
    letter-spacing: 0.05em;
    color: var(--paper);
    border-left: 2px solid var(--wabi-rust);
    padding-left: 14px;
    line-height: 1.7;
  }

  .featured-desc-jp {
    font-family: var(--mincho);
    font-size: 13.5px;
    line-height: 2.0;
    letter-spacing: 0.025em;
    color: #c2bfb7;
  }

  .featured-desc-en {
    font-family: var(--sans);
    font-size: 12.5px;
    line-height: 1.75;
    letter-spacing: 0.01em;
    color: var(--muted);
  }

  .featured-actions {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .archive-section {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    padding: 96px 4vw 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #070706;
    border-bottom: 1px solid var(--line-strong);
  }

  .zine-header {
    width: 100%;
    max-width: 1280px;
    border-top: 2px solid var(--fg);
    border-bottom: 1px solid var(--line-strong);
    padding: 16px 0;
    margin-bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
  }

  .zine-header-left {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .zine-kicker-bar {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  .zine-header h2 {
    font-family: var(--mincho);
    font-size: clamp(24px, 3.2vw, 38px);
    font-weight: 500;
    letter-spacing: 0.08em;
    line-height: 1.2;
  }

  .zine-right-meta {
    text-align: right;
    font-family: var(--mincho);
  }

  .zine-issue {
    display: block;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .zine-counter {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--fg);
    border: 1px solid var(--wabi-rust);
    padding: 4px 12px;
  }

  .cat-filter-bar {
    width: 100%;
    max-width: 1280px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }

  .cat-tab {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: var(--mincho);
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 8px 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.22s ease;
  }

  .cat-tab span.en-sub {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    opacity: 0.8;
  }

  .cat-tab:hover, .cat-tab:focus-visible {
    border-color: var(--line-strong);
    color: var(--fg);
    outline: none;
  }

  .cat-tab.active {
    background: #141312;
    border-color: var(--wabi-rust);
    color: var(--fg);
  }

  .cf-stage {
    position: relative;
    width: 100%;
    max-width: 1320px;
    height: 410px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.14);
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }

  .cf-track {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .mag-polaroid {
    position: absolute;
    width: 300px;
    background: var(--paper);
    color: var(--ink);
    padding: 0 0 16px;
    border: 1px solid #9e998c;
    box-shadow:
      0 18px 36px rgba(0, 0, 0, 0.9),
      0 2px 5px rgba(0, 0, 0, 0.95);
    transition:
      transform 0.46s cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.32s ease,
      filter 0.32s ease,
      border-color 0.28s ease,
      box-shadow 0.32s ease;
    will-change: transform, opacity;
    overflow: hidden;
  }

  .mag-polaroid:not(.active) {
    filter: brightness(0.62) contrast(1.08);
  }

  .mag-polaroid.active {
    filter: brightness(1) contrast(1.03);
    box-shadow:
      0 28px 58px rgba(0, 0, 0, 0.98),
      0 6px 14px rgba(0, 0, 0, 0.92);
  }

  .mag-polaroid:hover {
    opacity: 0.78 !important;
    border-color: var(--wabi-rust);
    filter: brightness(1.06) contrast(0.95) !important;
    box-shadow:
      0 32px 64px rgba(0, 0, 0, 0.95),
      0 0 0 1px var(--wabi-rust);
  }

  .mag-polaroid:hover .mag-headline {
    color: var(--wabi-rust);
  }

  .cf-track:hover .mag-polaroid:not(:hover) {
    opacity: 0.45 !important;
  }

  .mag-polaroid:focus-visible {
    outline: 2px solid var(--wabi-rust);
    outline-offset: 4px;
  }

  .mag-photo-wrap {
    position: relative;
    margin: 12px 12px 0;
    aspect-ratio: 1.12 / 1;
    background: #060605;
    border: 1.5px solid var(--ink);
    overflow: hidden;
  }

  .work-live-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .mag-sticker {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 3;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border: 1px solid var(--ink);
  }

  .mag-article-box {
    padding: 12px 14px 0;
    position: relative;
    z-index: 2;
  }

  .mag-kicker-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mincho);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #3d3b35;
    border-bottom: 1px solid rgba(17, 17, 16, 0.25);
    padding-bottom: 5px;
  }

  .mag-headline {
    margin-top: 8px;
    font-family: var(--display);
    font-size: 26px;
    letter-spacing: -0.01em;
    line-height: 1.04;
    color: var(--ink);
    text-transform: uppercase;
    transition: color 0.25s ease;
  }

  .cf-controls {
    margin-top: 26px;
    width: 100%;
    max-width: 540px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .cf-btn {
    background: #121211;
    border: 1px solid var(--line-strong);
    color: var(--fg);
    font-family: var(--mincho);
    font-size: 11px;
    padding: 8px 16px;
    letter-spacing: 0.08em;
    transition: background 0.2s, color 0.2s;
  }
  .cf-btn:hover, .cf-btn:focus-visible {
    background: var(--paper);
    color: var(--ink);
    outline: none;

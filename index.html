@keyframes glitch-b{0%,4%{opacity:0;transform:translateX(26px)}8%{opacity:.9;transform:translateX(-20px);clip-path:inset(57% 0 5% 0)}12%{opacity:.8;transform:translateX(24px);clip-path:inset(4% 0 72% 0)}16%{opacity:.95;transform:translateX(-12px);clip-path:inset(34% 0 30% 0)}21%{opacity:.65;transform:translateX(8px);clip-path:inset(0 0 62% 0)}28%,45%{opacity:0;transform:none}49%{opacity:.8;transform:translateX(12px);clip-path:inset(18% 0 57% 0)}52%{opacity:.9;transform:translateX(-13px);clip-path:inset(57% 0 8% 0)}55%,65%{opacity:0;transform:none}69%{opacity:.7;transform:translateX(-10px);clip-path:inset(12% 0 64% 0)}73%,100%{opacity:0;transform:none}}

<script>
// Replay the title reveal on every page load, including browsers that prefer reduced motion.
requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.glitch-line').forEach(line=>line.classList.add('glitch-active'))));

// Add or edit entries here. Use an existing art class or add your own CSS artwork.
const works=[
 {no:'001',title:'WHERE IS THE CLOUD?',year:'2026',category:'INFRASTRUCTURE / NETWORK',type:'VISIBLE',copy:'画面の向こうにあるクラウドは、どこに存在し、私たちの日常をどう支えているのか。',theory:'見えないインフラを可視化し、便利さの背後にある物理的な依存関係を問い直す。',art:'a7',href:'https://tnakajox.github.io/where-is-the-cloud/'},
 {no:'002',title:'ABOVE US',year:'2026',category:'SATELLITE / ORBIT',type:'VISIBLE',copy:'頭上を通過する人工衛星は、何のために飛び、私たちの暮らしとどうつながっているのか。',theory:'日常の空間を宇宙スケールへ拡張し、普段は意識されない人工物との関係を捉え直す。',art:'a8',href:'https://tnakajox.github.io/above-us/'},
 {no:'003',title:'DETOUR TO THE SHORTEST',year:'2026',category:'ROUTE / ALGORITHM',type:'VISIBLE',copy:'最短距離を選ぶことは、本当に最良の選択なのだろうか。',theory:'最適化という合理性を疑い、遠回りや偶然が生み出す価値を考える。',art:'a9',href:'https://tnakajox.github.io/DETOURTOTHE-SHORTEST/'},
 {no:'004',title:'THE SHAPE OF WAVES',year:'2026',category:'WAVE / VISUALIZATION',type:'VISIBLE',copy:'目には見えない波の動きに、どのような形を見いだせるだろうか。',theory:'現象を別の感覚へ翻訳し、直接見ることのできない動きや構造を知覚する。',art:'a10',href:'https://tnakajox.github.io/shapeofwaves/'},
 {no:'005',title:'64 FRAGMENTS',year:'2026',category:'FRAGMENT / COMPOSITION',type:'ART',copy:'断片に分かれた情報やイメージを組み合わせると、何が立ち上がるのか。',theory:'断片の配置と関係性によって意味が生まれるという、構成と解釈の問題を扱う。',art:'a11',href:'https://tnakajox.github.io/64FRAGMENTS/'},
 {no:'006',title:'THE INVISIBLE LINE',year:'2026',category:'LINE / BOUNDARY',type:'ART',copy:'目に見えない線は、どこに引かれ、何を隔て、何をつないでいるのか。',theory:'見えない境界や関係性を手がかりに、私たちが世界を区切り、認識する仕組みを問い直す。',art:'a12',href:'https://tnakajox.github.io/the-invisible-line/'}
];

const gallery=document.querySelector('#gallery');
const count=document.querySelector('#count');
const filters=[...document.querySelectorAll('.filter')];
let activeFilter='ALL';

function renderWorks(filter,animate=true){
 const visible=works.filter(w=>filter==='ALL'||w.type===filter);
 const oldRects=new Map([...gallery.children].map(el=>[el.dataset.key,el.getBoundingClientRect()]));
 gallery.innerHTML=visible.map(w=>{
  const external=w.href.startsWith('http');
  const target=external?' target="_blank" rel="noopener noreferrer"':'';
  return `<article class="card" data-key="${w.no}">
   <a class="art" href="${w.href}"${target} aria-label="${w.title} — 作品を開く">
    <div class="artwork ${w.art}"></div>
    <span class="art-tag">${w.no} / ${w.category}</span>
    <span class="art-number">${w.no}</span>
   </a>
   <div class="meta">
    <div>
     <h3>${w.title}</h3>
     <p class="work-copy">${w.copy}</p>
     <p class="theory"><span class="theory-label">THEORY / 理論</span>${w.theory}</p>
     <a class="work-link" href="${w.href}"${target}>OPEN EXPERIMENT</a>
    </div>
    <span class="year">${w.year}</span>
   </div>
  </article>`;
 }).join('');

 count.textContent=`${String(visible.length).padStart(2,'0')} WORKS`;

 if(animate){
  [...gallery.children].forEach((el,i)=>{
   const before=oldRects.get(el.dataset.key);
   const after=el.getBoundingClientRect();
   if(before){
    const dx=before.left-after.left,dy=before.top-after.top;
    if(dx||dy)el.animate(
     [{transform:`translate(${dx}px,${dy}px)`,opacity:.7},{transform:'translate(0,0)',opacity:1}],
     {duration:560,delay:i*24,easing:'cubic-bezier(.2,.75,.25,1)'}
    );
   }else{
    el.classList.add('is-entering');
    el.style.animationDelay=`${i*34}ms`;
   }
  });
 }
}

filters.forEach(button=>button.addEventListener('click',()=>{
 const next=button.dataset.filter;
 if(next===activeFilter)return;
 activeFilter=next;
 filters.forEach(b=>b.classList.toggle('active',b===button));
 renderWorks(activeFilter,true);
}));

renderWorks('ALL',false);

const clock=document.querySelector('#clock');
const updateClock=()=>{
 clock.textContent=new Intl.DateTimeFormat('ja-JP',{
  timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
 }).format(new Date());
};
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>

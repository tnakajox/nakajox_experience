<script>
// Replay the title reveal on every page load, including browsers that prefer reduced motion.
requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.glitch-line').forEach(line=>line.classList.add('glitch-active'))));

// Add or edit entries here. Use an existing art class (a1–a6) or add your own CSS artwork.
const works=[
 {no:'01',title:'影は、人間を認識するのか',year:'2026',category:'BODY / SHADOW',copy:'人の動きに従う影は、私たちを見分けているのだろうか。',art:'a1',href:'#work-01'},
 {no:'02',title:'沈黙に、かたちはあるか',year:'2026',category:'SOUND / SPACE',copy:'音のない時間を、私たちはどう受け取るのか。',art:'a2',href:'#work-02'},
 {no:'03',title:'この風景は、誰の記憶か',year:'2025',category:'LANDSCAPE / MEMORY',copy:'見慣れた景色の中に、自分の記憶を見つけられるか。',art:'a3',href:'#work-03'},

const updateClock=()=>{clock.textContent=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())};
